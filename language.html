<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Język aplikacji - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <style>
        .app-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding: 16px 18px 100px;
            box-sizing: border-box;
        }
        .section-label {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 18px 4px 10px;
        }
        .radio-card-group {
            background: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        .radio-row {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            gap: 16px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .radio-row:last-child {
            border-bottom: none;
        }
        .radio-row:active {
            background: rgba(255, 255, 255, 0.04);
        }
        html.theme-light .radio-row:active {
            background: rgba(0, 0, 0, 0.04);
        }
        .custom-radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #5c6474;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .custom-radio.checked {
            border-color: var(--accent-blue);
        }
        .custom-radio.checked::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-blue);
        }
        .radio-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .top_grid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 16px 0;
        }
        .action_grid {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--accent-blue);
        }
        .back_chevron { font-size: 20px; }
        .back_text { font-size: 16px; }
        .title_text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="top_grid">
            <div class="action_grid" onclick="sendTo('more')">
                <span class="back_chevron">&lt;</span>
                <span class="back_text">Więcej</span>
            </div>
            <h1 class="title_text">Język aplikacji</h1>
            <div style="width: 40px;"></div>
        </header>

        <div class="section-label">Wybierz język</div>
        <div class="radio-card-group">
            <div class="radio-row" onclick="setLang('pl')">
                <div class="custom-radio checked" id="lang-pl"></div>
                <div class="radio-title">Polski</div>
            </div>
            <div class="radio-row" onclick="setLang('en')">
                <div class="custom-radio" id="lang-en"></div>
                <div class="radio-title">English</div>
            </div>
            <div class="radio-row" onclick="setLang('uk')">
                <div class="custom-radio" id="lang-uk"></div>
                <div class="radio-title">Українська</div>
            </div>
        </div>
    </div>

    <!-- Dolny pasek nawigacji -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('services')">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid active" onclick="sendTo('more')">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
    <script>
        function updateLangUI() {
            var cur = localStorage.getItem('mobywatel_lang') || 'pl';
            ['pl', 'en', 'uk'].forEach(function(l) {
                var el = document.getElementById('lang-' + l);
                if (el) {
                    if (l === cur) el.classList.add('checked');
                    else el.classList.remove('checked');
                }
            });
        }
        function setLang(l) {
            localStorage.setItem('mobywatel_lang', l);
            updateLangUI();
        }
        document.addEventListener('DOMContentLoaded', updateLangUI);
    </script>
</body>
</html>
