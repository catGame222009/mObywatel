<!DOCTYPE html>
<html lang="pl">
<head>
    <title>O aplikacji - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <style>
        .app-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding: 16px 18px 100px;
            box-sizing: border-box;
        }
        .top_grid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 16px 0;
        }
        .action_grid {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--accent-blue);
        }
        .back_chevron { font-size: 20px; }
        .back_text { font-size: 16px; }
        .title_text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .about-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 24px 0 30px;
        }
        .about-logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(216, 35, 42, 0.35);
            margin-bottom: 12px;
        }
        .about-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .about-version {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .about-card {
            background: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .about-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .about-row:last-child { border-bottom: none; }
        .about-row-text {
            font-size: 15.5px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .about-chevron {
            font-size: 18px;
            color: #5c6474;
        }
        .about-footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="top_grid">
            <div class="action_grid" onclick="sendTo('more')">
                <span class="back_chevron">&lt;</span>
                <span class="back_text">Więcej</span>
            </div>
            <h1 class="title_text">O aplikacji</h1>
            <div style="width: 40px;"></div>
        </header>

        <div class="about-hero">
            <img src="more_files/logo_large.png" class="about-logo" alt="mObywatel">
            <div class="about-name">mObywatel 2.0</div>
            <div class="about-version">Wersja 4.89.0 (17)</div>
        </div>

        <div class="about-card">
            <div class="about-row">
                <span class="about-row-text">Regulamin aplikacji</span>
                <span class="about-chevron">&gt;</span>
            </div>
            <div class="about-row">
                <span class="about-row-text">Polityka prywatności</span>
                <span class="about-chevron">&gt;</span>
            </div>
            <div class="about-row">
                <span class="about-row-text">Deklaracja dostępności</span>
                <span class="about-chevron">&gt;</span>
            </div>
            <div class="about-row">
                <span class="about-row-text">Licencje open source</span>
                <span class="about-chevron">&gt;</span>
            </div>
        </div>

        <div class="about-footer">
            Ministerstwo Cyfryzacji<br>
            Centralny Ośrodek Informatyki (COI)<br>
            Rzeczpospolita Polska
        </div>
    </div>

    <!-- Dolny pasek nawigacji -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('services')">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid active" onclick="sendTo('more')">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
</body>
</html>
