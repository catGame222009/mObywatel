<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Pokaż kod QR - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <link rel="manifest" href="./manifest.json">
    <style>
        .showqr-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding-bottom: 90px;
            box-sizing: border-box;
        }
        .showqr-desc {
            font-size: 14px;
            line-height: 1.45;
            color: #8c93a0;
            padding: 16px 20px 20px;
        }
        .qr-display-card {
            background: #171a20;
            border-radius: 24px;
            width: calc(100% - 32px);
            margin: 0 auto 16px;
            padding: 28px 20px 22px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .qr-code-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
        }
        .qr-code-box img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: block;
        }
        .qr-numeric-code {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #ffffff;
            margin-bottom: 18px;
            text-align: center;
        }
        .progress-line-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-line-fill {
            height: 100%;
            width: 100%;
            background: #388af6;
            border-radius: 4px;
            transition: width 1s linear;
        }
        .expire-timer-text {
            font-size: 13.5px;
            color: #8c93a0;
        }
        .expire-timer-text strong {
            color: #ffffff;
        }
        .national-badges-card {
            background: #171a20;
            border-radius: 20px;
            width: calc(100% - 32px);
            margin: 0 auto;
            padding: 16px 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }
        .badge-flag-img {
            width: 58px;
            height: 36px;
            border-radius: 4px;
            object-fit: cover;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .badge-eagle-img {
            width: 32px;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="showqr-wrapper">
        <header class="top_grid">
            <div class="action_grid" onclick="sendTo('qr')">
                <span class="back_chevron">&lt;</span>
                <span class="back_text">Kod QR</span>
            </div>
            <h1 class="title_text" style="font-size: 16px;">Pokaż kod QR</h1>
            <div class="help_icon_btn" onclick="sendTo('more')">?</div>
        </header>

        <p class="showqr-desc">
            Poproś osobę, której sprawdzasz dokument, aby zeskanowała lub przepisała ten kod w swojej aplikacji mObywatel.
        </p>

        <div class="qr-display-card">
            <div class="qr-code-box">
                <img src="assets/images/qr.png" alt="QR Code">
            </div>
            <div class="qr-numeric-code" id="numericCode">5 3 0 2 9 8</div>
            <div class="progress-line-container">
                <div class="progress-line-fill" id="progressFill"></div>
            </div>
            <div class="expire-timer-text">
                Kod wygaśnie za: <strong id="countdownText">3 min 0 sek</strong>
            </div>
        </div>

        <div class="national-badges-card">
            <img src="assets/images/flag.webp" class="badge-flag-img" alt="Flaga Polski">
            <img src="assets/images/eagle.png" class="badge-eagle-img" alt="Godło Polski">
        </div>
    </div>

    <!-- Dolny pasek nawigacji -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('services')">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid active" onclick="sendTo('qr')">
                <div class="bottom_element_image qr_open qr"></div>
                <p class="bottom_element_text open">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('more')">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
    <script>
        let totalSeconds = 180;
        let remaining = totalSeconds;

        function updateTimer() {
            if (remaining <= 0) {
                remaining = totalSeconds;
                // Losuj nowy kod
                const n = Math.floor(100000 + Math.random() * 900000).toString();
                document.getElementById('numericCode').textContent = n.split('').join(' ');
            }
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            document.getElementById('countdownText').textContent = `${mins} min ${secs} sek`;
            const pct = (remaining / totalSeconds) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            remaining--;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
