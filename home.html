<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Dokumenty - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <link rel="manifest" href="./manifest.json">
    <style>
        .docs-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding: 24px 18px 100px;
            box-sizing: border-box;
        }
        .docs-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .docs-crest {
            width: 44px;
            height: 44px;
            background: #d8232a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(216, 35, 42, 0.35);
        }
        .docs-crest img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .docs-header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-action-btn {
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .docs-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 22px;
        }
        .docs-main-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.4px;
        }
        .docs-actions-links {
            display: flex;
            gap: 16px;
        }
        .docs-link-btn {
            color: #388af6;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        /* Stos kart w stylu iOS */
        .wallet-stack {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .wallet-card {
            border-radius: 22px;
            padding: 26px 28px;
            height: 240px;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
            overflow: hidden;
            margin-bottom: -140px;
        }
        .wallet-card.single-card,
        .wallet-card:only-child {
            margin-bottom: 0 !important;
            height: 280px !important;
        }
        .wallet-card:last-child:not(:only-child) {
            margin-bottom: 0;
            height: 280px;
        }
        .wallet-card:hover, .wallet-card:active {
            transform: translateY(-8px);
        }
        .wallet-card-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
            position: relative;
            z-index: 2;
        }
        .wallet-card-badge {
            position: absolute;
            top: 20px;
            right: 22px;
            width: 32px;
            height: 32px;
            z-index: 2;
        }
        .wallet-card-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .wallet-watermark {
            position: absolute;
            right: -20px;
            bottom: -30px;
            width: 180px;
            height: 180px;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="docs-wrapper">
        <div class="docs-header-top">
            <div class="docs-crest">
                <img src="assets/images/eagle-white.png" alt="Orzeł">
            </div>
            <div class="docs-header-actions">
                <!-- 1. Robot asystenta (ze screena) -->
                <button class="top-action-btn" onclick="sendTo('assistant')" title="Wirtualny asystent">
                    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 14V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8l-4 4v-4z"></path>
                        <circle cx="9" cy="11" r="1.2" fill="#ffffff"></circle>
                        <circle cx="15" cy="11" r="1.2" fill="#ffffff"></circle>
                        <line x1="8.5" y1="5" x2="8.5" y2="2.5"></line>
                        <line x1="15.5" y1="5" x2="15.5" y2="2.5"></line>
                        <line x1="1.5" y1="11" x2="4" y2="11"></line>
                        <line x1="20" y1="11" x2="22.5" y2="11"></line>
                    </svg>
                </button>
                <!-- 2. Koperta (ze screena) -->
                <button class="top-action-btn" onclick="sendTo('more')" title="Wiadomości">
                    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4.5" width="20" height="15" rx="2.5"></rect>
                        <path d="m2.5 5.5 9.5 7 9.5-7"></path>
                    </svg>
                </button>
                <!-- 3. Dzwonek (ze screena) -->
                <button class="top-action-btn" onclick="sendTo('more')" title="Powiadomienia">
                    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                        <path d="M10.2 21a2 2 0 0 0 3.6 0"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="docs-title-row">
            <h1 class="docs-main-title">Dokumenty</h1>
            <div class="docs-actions-links">
                <span class="docs-link-btn" onclick="sendTo('selectdocs')">Dostosuj</span>
                <span class="docs-link-btn" onclick="sendTo('selectdocs')">Dodaj</span>
            </div>
        </div>

        <!-- Dynamiczny stos dokumentów -->
        <div class="wallet-stack" id="docsStack">
            <!-- Renderowane przez skrypt ponizej -->
        </div>
    </div>

    <!-- Dolny pasek nawigacji 5 zakładek -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid active" onclick="sendTo('home')">
                <div class="bottom_icon_pill">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v2H2V6a2 2 0 0 1 2-2zm-2 6h20v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8zm12 3a1 1 0 0 0 0 2h3a1 1 0 0 0 0-2h-3z"/></svg>
                </div>
                <p class="bottom_element_text open">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('services')">
                <div class="bottom_icon_pill">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                </div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_icon_pill">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2 M16 4h2a2 2 0 0 1 2 2v2 M4 16v2a2 2 0 0 0 2 2h2 M16 20h2a2 2 0 0 0 2-2v-2"/><path d="M8 9.5c1.5-.8 2.5-.8 4 0s2.5.8 4 0"/><path d="M8 12.5c1.5-.8 2.5-.8 4 0s2.5.8 4 0"/><path d="M8 15.5c1.5-.8 2.5-.8 4 0s2.5.8 4 0"/></svg>
                </div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_icon_pill">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/><line x1="11" y1="8.5" x2="11" y2="13.5"/><line x1="8.5" y1="11" x2="13.5" y2="11"/></svg>
                </div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('more')">
                <div class="bottom_icon_pill">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7.5" cy="7.5" r="3.2"/><circle cx="16.5" cy="7.5" r="3.2"/><circle cx="7.5" cy="16.5" r="3.2"/><circle cx="16.5" cy="16.5" r="3.2"/></svg>
                </div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
    <script>
        const DOCS_DEFINITIONS = {
            'mdowod': {
                name: 'mDowód',
                bg: 'linear-gradient(135deg, #1e40af, #3b82f6)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'driver': {
                name: 'mPrawo jazdy',
                bg: 'linear-gradient(135deg, #701a75, #dc2626)',
                url: 'card.html',
                badge: '<div style="width: 28px; height: 28px; border-radius: 50%; border: 1.5px dashed #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff;">PL</div>'
            },
            'student': {
                name: 'Legitymacja studencka',
                bg: 'linear-gradient(135deg, #10b981, #0284c7)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'legal': {
                name: 'Legitymacja radcy prawnego',
                bg: 'linear-gradient(135deg, #1e3a8a, #0284c7)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'temporary': {
                name: 'Dokument ochrony czasowej',
                bg: 'linear-gradient(135deg, #0284c7, #eab308)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'school': {
                name: 'Legitymacja szkolna',
                bg: 'linear-gradient(135deg, #0284c7, #e11d48)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'builder': {
                name: 'Legitymacja inżyniera budownictwa',
                bg: 'linear-gradient(135deg, #a83232, #4a154b)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'disabled': {
                name: 'Legitymacja osoby niepełnosprawnej',
                bg: 'linear-gradient(135deg, #10b981, #6366f1)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'largefamily': {
                name: 'Karta Dużej Rodziny',
                bg: 'linear-gradient(135deg, #ec4899, #8b5cf6)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            },
            'pensioner': {
                name: 'Legitymacja emeryta-rencisty',
                bg: 'linear-gradient(135deg, #059669, #10b981)',
                url: 'card.html',
                badge: '<img src="assets/images/eagle-white.png" alt="Godło">'
            }
        };

        function renderDocs() {
            let selected = ['mdowod'];
            try {
                const s = localStorage.getItem('mobywatel_selected_docs');
                if (s) {
                    const parsed = JSON.parse(s);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        selected = parsed;
                    }
                }
            } catch(e) {}

            const stack = document.getElementById('docsStack');
            if (!stack) return;
            stack.innerHTML = '';

            selected.forEach(docId => {
                const def = DOCS_DEFINITIONS[docId];
                if (!def) return;
                const card = document.createElement('div');
                card.className = 'wallet-card' + (selected.length === 1 ? ' single-card' : '');
                card.style.background = def.bg;
                card.onclick = () => sendTo(def.url);
                card.innerHTML = `
                    <div class="wallet-card-name">${def.name}</div>
                    <div class="wallet-card-badge">${def.badge}</div>
                    <img src="assets/images/eagle-white.png" class="wallet-watermark" alt="">
                `;
                stack.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', renderDocs);
    </script>
</body>
</html>
