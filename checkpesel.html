<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Sprawdź PESEL - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <link rel="manifest" href="./manifest.json">
    <style>
        .page-sub-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding: 16px 18px 100px;
            box-sizing: border-box;
        }
        .page-badge-icon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 26px;
            background: #2a163e;
            color: #b05af8;
        }
        .page-big-title {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 14px;
        }
        .page-big-desc {
            font-size: 14px;
            line-height: 1.45;
            color: #8c93a0;
            margin-bottom: 24px;
        }
        .section-label {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .page-card-menu {
            background: #171a20;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .page-menu-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #388af6;
        }
        .page-menu-row:last-child {
            border-bottom: none;
        }
        .page-menu-row .chevron {
            color: #5c6474;
            font-size: 20px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="page-sub-wrapper">
        <header class="top_grid" style="padding: 10px 0 20px;">
            <div class="action_grid" onclick="sendTo('services')">
                <span class="back_chevron">&lt;</span>
                <span class="back_text">Usługi</span>
            </div>
            <h1 class="title_text" style="font-size: 16px;">Sprawdź PESEL</h1>
            <div style="width: 22px;"></div>
        </header>

        <div class="page-badge-icon">🔍</div>
        <h1 class="page-big-title">Sprawdź PESEL drugiej osoby</h1>
        <p class="page-big-desc">
            Chcesz załatwić z kimś sprawę? Dowiedz się, czy ma zastrzeżony PESEL, czy nie.
        </p>

        <div class="section-label">W czyim imieniu sprawdzasz?</div>
        <div class="page-card-menu">
            <div class="page-menu-row" onclick="checkPeselPrompt('własnym')">
                <span>Własnym</span>
                <span class="chevron">&gt;</span>
            </div>
            <div class="page-menu-row" onclick="checkPeselPrompt('firmy')">
                <span>Firmy lub instytucji</span>
                <span class="chevron">&gt;</span>
            </div>
        </div>
    </div>

    <!-- Dolny pasek nawigacji -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid active" onclick="sendTo('services')">
                <div class="bottom_element_image services_open services"></div>
                <p class="bottom_element_text open">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('more')">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
    <script>
        function checkPeselPrompt(typ) {
            const p = prompt("Wpisz numer PESEL do weryfikacji:");
            if (p) {
                alert(`PESEL ${p} został sprawdzony w rejestrze: NIEZASTRZEŻONY.`);
            }
        }
    </script>
</body>
</html>
