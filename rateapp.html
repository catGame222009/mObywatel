<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Oceń aplikację - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <style>
        .app-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding: 16px 18px 100px;
            box-sizing: border-box;
        }
        .top_grid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 16px 0;
        }
        .action_grid {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--accent-blue);
        }
        .back_chevron { font-size: 20px; }
        .back_text { font-size: 16px; }
        .title_text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .rate-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 26px 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            text-align: center;
            margin-top: 20px;
        }
        .rate-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .rate-desc {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.45;
            margin-bottom: 24px;
        }
        .stars-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 26px;
        }
        .star-svg {
            width: 38px;
            height: 38px;
            cursor: pointer;
            fill: #393e46;
            transition: all 0.2s ease;
        }
        .star-svg.selected {
            fill: #f5a623;
            transform: scale(1.1);
        }
        .rate-textarea {
            width: 100%;
            height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
        }
        html.theme-light .rate-textarea {
            background: rgba(0, 0, 0, 0.03);
        }
        .rate-btn {
            width: 100%;
            height: 48px;
            background: #1b6ef3;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .rate-btn:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="top_grid">
            <div class="action_grid" onclick="sendTo('more')">
                <span class="back_chevron">&lt;</span>
                <span class="back_text">Więcej</span>
            </div>
            <h1 class="title_text">Oceń aplikację</h1>
            <div style="width: 40px;"></div>
        </header>

        <div class="rate-card">
            <div class="rate-title">Podoba Ci się mObywatel?</div>
            <div class="rate-desc">Twoja opinia pomaga nam ulepszać aplikację i dostosowywać ją do Twoich potrzeb.</div>

            <div class="stars-row" id="stars">
                <svg class="star-svg selected" onclick="setRating(1)" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <svg class="star-svg selected" onclick="setRating(2)" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <svg class="star-svg selected" onclick="setRating(3)" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <svg class="star-svg selected" onclick="setRating(4)" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <svg class="star-svg selected" onclick="setRating(5)" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </div>

            <textarea class="rate-textarea" placeholder="Napisz krótki komentarz (opcjonalnie)..."></textarea>
            <button class="rate-btn" onclick="submitRating()">Prześlij opinię</button>
        </div>
    </div>

    <!-- Dolny pasek nawigacji -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('services')">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid active" onclick="sendTo('more')">
                <div class="bottom_element_image more_open more"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
    <script>
        var curRating = 5;
        function setRating(r) {
            curRating = r;
            var svgs = document.querySelectorAll('.star-svg');
            svgs.forEach((s, idx) => {
                if (idx < r) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        }
        function submitRating() {
            alert('Dziękujemy za wystawienie oceny!');
            sendTo('more');
        }
    </script>
</body>
</html>
