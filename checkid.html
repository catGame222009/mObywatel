<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Sprawdź dowód - mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/card.css?v=2.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
    <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <link rel="manifest" href="./manifest.json">
    <style>
        .page-sub-wrapper {
            width: 100%;
            max-width: 414px;
            margin: 0 auto;
            padding: 16px 18px 100px;
            box-sizing: border-box;
        }
        .page-badge-icon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 26px;
            background: #2a163e;
            color: #b05af8;
        }
        .page-big-title {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 14px;
        }
        .page-big-desc {
            font-size: 14px;
            line-height: 1.45;
            color: #8c93a0;
            margin-bottom: 26px;
        }
        .input-card-box {
            background: #171a20;
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 28px;
        }
        .input-card-box label {
            display: block;
            font-size: 13px;
            color: #8c93a0;
            margin-bottom: 8px;
        }
        .input-card-box input {
            background: none;
            border: none;
            width: 100%;
            font-size: 17px;
            font-weight: 500;
            color: #ffffff;
            outline: none;
        }
        .input-card-box input::placeholder {
            color: #5c6474;
        }
        .check-submit-btn {
            background: #388af6;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            padding: 15px 0;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 16px rgba(56, 138, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="page-sub-wrapper">
        <header class="top_grid" style="padding: 10px 0 20px;">
            <div class="action_grid" onclick="sendTo('services')">
                <span class="back_chevron">&lt;</span>
                <span class="back_text">Usługi</span>
            </div>
            <h1 class="title_text" style="font-size: 16px;">Sprawdź dowód</h1>
            <div style="width: 22px;"></div>
        </header>

        <div class="page-badge-icon">🆔</div>
        <h1 class="page-big-title">Sprawdź, czy dowód jest unieważniony lub zawieszony</h1>
        <p class="page-big-desc">
            Możesz sprawdzić dowód osobisty swój lub innej osoby.
        </p>

        <div class="input-card-box">
            <label>Seria i numer dowodu</label>
            <input type="text" placeholder="Wpisz serię i numer dowodu" id="idCheckInput">
        </div>

        <button type="button" class="check-submit-btn" onclick="checkIdStatus()">Sprawdź dowód</button>
    </div>

    <!-- Dolny pasek nawigacji -->
    <nav class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="sendTo('home')">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid active" onclick="sendTo('services')">
                <div class="bottom_element_image services_open services"></div>
                <p class="bottom_element_text open">Usługi</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('qr')">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('search')">
                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>
            </div>
            <div class="bottom_element_grid" onclick="sendTo('more')">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </nav>

    <script src="assets/bar.js"></script>
    <script>
        function checkIdStatus() {
            const v = document.getElementById('idCheckInput').value.trim();
            if (!v) {
                alert("Wpisz serię i numer dowodu!");
                return;
            }
            alert(`Dowód o numerze ${v} jest WAŻNY (nieunieważniony).`);
        }
    </script>
</body>
</html>
